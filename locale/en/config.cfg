[technology-description]
pneumatic-transport=Unlocks basic pneumatic transport infrastructure, including tubes, pressure pumps, junction hubs, and standard transport capsules.
capsule-counter=Unlocks pneumatic capsule counters to detect transport capsules and cargo contents across tube network segments and output circuit signals.
pneumatic-fence-gate-interoperability=Enables the pneumatic flow network to integrate directly with defensive walls and fence gates, allowing pressurized routing through perimeter defenses with automatic gate cutoff and continuous sensor tracking.
specialized-pneumatic-capsules=Unlocks advanced pneumatic routing infrastructure and personnel transport, including 4-way programmable diverters, crossflow junctions, and player transit capsules.
biodegradable-capsule=Unlocks single-use eco-friendly capsules optimized for organic item transport, cultured in Biochambers.
reinforced-capsule=Unlocks heavy-duty reinforced capsules for high-volume bulk industrial item transport, cast in Foundries.
electromagnetic-capsule=Unlocks electromagnetic capsules that allow unrestricted mixing of items, quantities, and qualities during transit, manufactured in Electromagnetic Plants.
pneumatic-projector=Unlocks electromagnetic projectors capable of launching electromagnetic capsules across open planetary terrain along line-of-sight kinetic beams.
refrigerated-capsule=Unlocks temperature-controlled refrigerated capsules to slow spoilage during long-distance transit and cryogenic recharging recipes.
vacuum-capsule=Unlocks vacuum capsules capable of siphoning cargo directly off adjacent transport belts without inserters, alongside electric repressurization recipes.

