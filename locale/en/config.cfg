[item-description]
item-capsule=Standard reusable transport container.\nCapacity: 1 stack (+1 per Quality tier). Holds full stacks of items up to the capsule's quality tier (mixed cargo allowed).
biodegradable-capsule=Single-use eco-friendly container that dissolves upon unloading.\nCapacity: 1 stack (+1 per Quality tier). Organic items consume 0.5 slots. Cultured in Biochambers.
refrigerated-capsule=Temperature-controlled container that reduces spoilage by 90%.\nCapacity: 1 stack (+1 per Quality tier). Holds full stacks of biological items up to the capsule's quality tier (mixed cargo allowed). Recharged at cryogenic plants when depleted.
spent-refrigerated-capsule=Depleted refrigerated capsule shell with exhausted coolant.\nCapacity: 1 stack (+1 per Quality tier). Holds full stacks of biological items up to the capsule's quality tier (mixed cargo allowed). Provides no spoilage protection. Recharge at cryogenic plants using cold fluoroketone.
reinforced-capsule=Heavy-duty hull for strict bulk transport.\nCapacity: 2 stacks (+2 per Quality tier). Requires all slots to be filled with a single item type of uniform quality. Cast in Foundries.
electromagnetic-capsule=Advanced Fulgora container for mixed cargo.\nCapacity: 1 stack (+1 per Quality tier). Accepts any combination of item types, quantities, and qualities. Assembled in Electromagnetic Plants.
vacuum-capsule=Inserter-free transport container with belt-siphoning vacuum capability.\nCapacity: 1 stack (+1 per Quality tier). Automatically siphons items directly off adjacent transport belts into hub ports. Consumes charges during belt extraction and converts into a spent capsule shell when depleted.
spent-vacuum-capsule=Depleted vacuum capsule shell with exhausted charges.\nCapacity: 1 stack (+1 per Quality tier). Holds full stacks of items up to the capsule's quality tier. Vacuum extraction disabled until repressurized at an assembling machine.
player-transit-capsule=Pressurized personnel capsule for automated player travel.\nPress __CONTROL__capsule-emergency-exit__ to eject in transit.
pneumatic-capsule-counter=Counts transport capsules and cargo contents passing through its assigned tube network territory and outputs circuit signals.
pneumatic-projector=Fulgora planetary projector facility. Accelerates and launches electromagnetic-capsule payloads across open terrain along line-of-sight kinetic beams.

