capsule-hub-horizontal=Horizontal hub endpoint for loading, unloading, and routing pneumatic transport capsules.
capsule-hub-vertical=Vertical hub endpoint for loading, unloading, and routing pneumatic transport capsules.
pneumatic-tube=Transports pneumatic capsules across the network via pressure differentials.
pneumatic-pump=Generates active pressure gradients to drive pneumatic capsule velocity and direction.
junction=Connects four pneumatic tubes together, allowing capsules to transition between intersecting lines.
crossflow-junction=Provides independent multi-axis pipe crossovers without blending pressure networks.
pneumatic-diverter=Programmable 4-way active diverter routing capsules based on directional mode and item filters.

