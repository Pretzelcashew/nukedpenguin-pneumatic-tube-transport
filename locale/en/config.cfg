[technology-description]
pneumatic-transport=Unlocks basic pneumatic transport infrastructure, including tubes, pressure pumps, junction hubs, and standard transport capsules.
capsule-counter=Unlocks pneumatic capsule counters to detect transport capsules and cargo contents across tube network segments and output circuit signals.
specialized-pneumatic-capsules=Unlocks advanced capsule types tailored for specialized logistics, including refrigerated containers, reinforced hulls, and player transit.
biodegradable-capsule=Unlocks single-use eco-friendly capsules optimized for organic item transport.
reinforced-capsule=Unlocks heavy-duty reinforced capsules for high-volume bulk industrial item transport.
electromagnetic-capsule=Unlocks electromagnetic capsules that allow unrestricted mixing of items, quantities, and qualities during transit.
refrigerated-capsule=Unlocks temperature-controlled refrigerated capsules to slow spoilage during long-distance transit and cryogenic recharging recipes.
vacuum-capsule=Unlocks vacuum capsules capable of siphoning cargo directly off adjacent transport belts without inserters, alongside assembly recharging recipes.

